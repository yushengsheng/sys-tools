[package]
name = "systools"
version = "0.1.0"
edition = "2021"
description = "sys tools：Windows 软件、空间与目录迁移工具"
license = "MIT"
build = "build.rs"

[dependencies]
junction = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security",
    "Win32_Storage_FileSystem", "Win32_System_Com",
    "Win32_System_Environment", "Win32_System_LibraryLoader",
    "Win32_System_Registry", "Win32_System_RestartManager",
    "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_Controls", "Win32_UI_HiDpi",
    "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
strip = true
opt-level = "s"

